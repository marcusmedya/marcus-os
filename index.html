<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Marcus Medya App</title>

    <!-- Telefona uygulama gibi kurulabilmesi için (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0C0E13" />
    <!-- Simgeler /api/logo'dan gelir: Ayarlar > Marka Kimliği'ne yüklenen logo neyse o.
         Yüklenmemişse varsayılan simgeye düşer. Böylece logo değiştiğinde dosya değiştirmeye
         ya da yeniden yayına almaya gerek kalmaz. -->
    <link rel="icon" href="/api/logo" />
    <link rel="apple-touch-icon" href="/api/logo" />

    <!-- LİNK ÖNİZLEMESİ (WhatsApp, Slack, iMessage…) — eskiden hiç yoktu, o yüzden
         paylaşılan bağlantı çıplak görünüyor ya da tarayıcı simgesi kullanılıyordu. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Marcus Medya" />
    <meta property="og:title" content="Marcus Medya — İçerik Onay Paneli" />
    <meta property="og:description" content="Hazırladığımız içerikleri buradan inceleyip onaylayabilir ya da değişiklik isteyebilirsiniz." />
    <meta property="og:image" content="/api/logo?tip=paylasim" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Marcus Medya — İçerik Onay Paneli" />
    <meta name="twitter:description" content="Hazırladığımız içerikleri buradan inceleyip onaylayabilir ya da değişiklik isteyebilirsiniz." />
    <meta name="twitter:image" content="/api/logo?tip=paylasim" />
    <!-- iPhone'da ana ekrandan açılınca tarayıcı çubuğu görünmesin -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marcus" />
  </head>
  <body style="margin:0;background:#0C0E13;">
    <script>
      // Kayıtlı tema, React yüklenmeden ÖNCE zemine uygulanır. Yoksa açık tema seçiliyken
      // sayfa önce koyu boyanıp sonra beyaza dönüyor ve her açılışta göze çarpıyordu.
      try {
        if (localStorage.getItem("marcus-os-tema") === "acik") {
          document.body.style.background = "#F4F5F7";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#F4F5F7");
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker sadece kurulabilirlik için; önbellek yapmıyor (bkz. public/sw.js).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
